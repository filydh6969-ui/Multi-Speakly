name: Build APK
on:
  push:
    branches: [main, master]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: npm install
      - name: Preparar Three.js con cargador de modelos (mascota 3D)
        continue-on-error: true
        run: |
          npm install --no-save esbuild
          npx esbuild src/three-bundle.js --bundle --minify --format=iife --outfile=www/three.min.js || cp node_modules/three/build/three.min.js www/three.min.js
          ls -la www
      - name: Instalar Blender
        continue-on-error: true
        run: sudo apt-get update && (sudo apt-get install -y blender python3-numpy || sudo snap install blender --classic)
      - name: Crear mascota 3D con Blender
        continue-on-error: true
        run: |
          mkdir -p out
          blender -b --python blender/build_mascot.py -- out 2>&1 | tee out/blender_log.txt || true
          ls -la out
          cp out/mascot.glb www/mascot.glb
          ls -la www
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Mascota-Blender
          path: out
          if-no-files-found: ignore
      - run: npx cap add android
      - name: Permitir motor de voz (TTS)
        run: sed -i 's#<application#<queries><intent><action android:name="android.intent.action.TTS_SERVICE"/></intent></queries>\n    <application#' android/app/src/main/AndroidManifest.xml
      - name: Icono del gatito
        run: |
          sudo apt-get update && sudo apt-get install -y librsvg2-bin
          R=android/app/src/main/res
          sed 's/viewBox="0 0 100 100"/viewBox="-25 -25 150 150"/; s#<rect[^>]*/>##' icon.svg > fg.svg
          for d in mdpi:48:108 hdpi:72:162 xhdpi:96:216 xxhdpi:144:324 xxxhdpi:192:432; do
            IFS=: read n l f <<< "$d"
            mkdir -p $R/mipmap-$n
            rsvg-convert -w $l -h $l icon.svg -o $R/mipmap-$n/ic_launcher.png
            cp $R/mipmap-$n/ic_launcher.png $R/mipmap-$n/ic_launcher_round.png
            rsvg-convert -w $f -h $f fg.svg -o $R/mipmap-$n/ic_launcher_foreground.png
          done
          printf '<?xml version="1.0" encoding="utf-8"?>\n<resources>\n  <color name="ic_launcher_background">#2563EB</color>\n</resources>\n' > $R/values/ic_launcher_background.xml
      - run: npx cap sync android
      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: Kitty-Speakly-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
